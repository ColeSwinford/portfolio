<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Preview Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --bg-dark: #1d252c;
            --accent-mint: #82FFD8;
            --text-white: #D3E1EF;
            --text-gray: #B7C5D3;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background-color: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-container {
            /* Increased padding to keep the card substantial without empty gaps */
            padding: 80px 70px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0) 100%);
            border-radius: 24px;
            width: 1000px;
            
            /* Changed from fixed height to auto so it wraps content snugly */
            height: auto;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .hero-hi { 
            font-size: 24px; 
            font-weight: 400; 
            color: var(--accent-mint); 
            margin-bottom: 1rem; 
            font-family: monospace;
        }
        
        .hero-name { 
            font-size: 90px; 
            font-weight: 700; 
            line-height: 1; 
            color: var(--text-white); 
            margin: 0;
            letter-spacing: -2px;
        }
        
        .hero-tagline { 
            font-size: 60px; 
            font-weight: 500; 
            line-height: 1.2; 
            color: var(--text-gray); 
            margin-top: 10px;
            margin-bottom: 2rem; 
        }

        .hero-line {
            width: 80px;
            height: 6px;
            background: var(--accent-mint);
            border-radius: 3px;
            margin-bottom: 0; /* Removed margin to control space via footer margin */
        }

        .footer {
            /* Changed from 'auto' (bottom of card) to fixed spacing */
            margin-top: 50px;
            
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-gray);
            font-size: 20px;
            font-family: monospace;
        }

        .dot {
            color: var(--accent-mint);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <span class="hero-hi">Hi, my name is</span>
        <h1 class="hero-name">Cole Swinford.</h1>
        <h2 class="hero-tagline">I build things.</h2>
        <div class="hero-line"></div>
        
        <div class="footer">
            coleswinford.com <span class="dot">•</span> Software Engineer
        </div>
    </div>

</body>
</html>
